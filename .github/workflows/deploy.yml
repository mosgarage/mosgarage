name: Deploy MosGarage
on:
  push:
    branches: [ main ]
jobs:
  notify-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Notify VPS webhook for deploy
        run: |
          curl -sS -X POST "http://${{ secrets.VPS_HOST }}:4000/webhook" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$(printf '${{ secrets.WEBHOOK_SECRET }}' | openssl dgst -sha256 -hmac '${{ secrets.WEBHOOK_SECRET }}' -r | awk '{print $1}')"
